name: X Digest Update

on:
  schedule:
    - cron: "15 12 * * *" # 12:15 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch digest
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: npm run x:digest

      - name: Commit and push if changed
        run: |
          git config user.name "the-fellow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/x-digest.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update X digest"
          git push
